<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;

    function updateThemeUI(isDark) {
        // On cible TOUTES les cartes de la page
        const allCards = document.querySelectorAll('.card');

        if (isDark) {
            // MODE SOMBRE
            body.style.backgroundColor = "#000000";
            body.style.color = "#adafae";
            
            allCards.forEach(card => {
                card.style.backgroundColor = "#111111";
                card.style.borderColor = "#ff6600";
            });

            toggleBtn.innerHTML = "☀️ Mode Clair";
            toggleBtn.className = "btn btn-outline-warning btn-sm mt-1";
        } else {
            // MODE CLAIR
            body.style.backgroundColor = "#ADAFAE";
            body.style.color = "#212529";
            
            allCards.forEach(card => {
                card.style.backgroundColor = "#f8f9fa";
                card.style.borderColor = "#dee2e6";
            });

            toggleBtn.innerHTML = "🌙 Mode Sombre";
            toggleBtn.className = "btn btn-outline-dark btn-sm mt-1";
        }

        // Ajustement automatique de tous les textes pour la lisibilité
        const allTexts = document.querySelectorAll('p, h2, h3, .text-dark, .text-light');
        allTexts.forEach(el => {
            // On ne touche pas aux titres orange (#ff6600)
            if (!el.classList.contains('text-orange') && el.style.color !== 'rgb(255, 102, 0)') {
                el.style.setProperty('color', isDark ? '#adafae' : '#212529', 'important');
            }
        });
    }

    toggleBtn.addEventListener('click', () => {
        const isCurrentlyDark = localStorage.getItem('theme') !== 'light';
        const nextTheme = isCurrentlyDark ? 'light' : 'dark';
        localStorage.setItem('theme', nextTheme);
        updateThemeUI(nextTheme === 'dark');
    });

    // Chargement initial basé sur la mémoire du navigateur
    const savedTheme = localStorage.getItem('theme') || 'dark';
    updateThemeUI(savedTheme === 'dark');
</script>
<script>
const startBtn = document.getElementById('start-btn');
const gameContainer = document.getElementById('game-container');
const ghost = document.getElementById('ghost');
const scoreDisplay = document.getElementById('score');
const timeDisplay = document.getElementById('time');

let score = 0;
let timeLeft = 30;
let gameInterval;
let ghostTimeout;

function moveGhost() {
    // Récupère les dimensions du conteneur pour garder le fantôme à l'intérieur
    const containerRect = gameContainer.getBoundingClientRect();
    const ghostSize = 50; 
    
    const maxX = containerRect.width - ghostSize;
    const maxY = containerRect.height - ghostSize;

    // Génère des coordonnées aléatoires
    const randomX = Math.floor(Math.random() * maxX);
    const randomY = Math.floor(Math.random() * maxY);

    ghost.style.left = randomX + 'px';
    ghost.style.top = randomY + 'px';
    ghost.style.display = 'block';

    // Fait disparaître le fantôme s'il n'est pas cliqué à temps
    clearTimeout(ghostTimeout);
    ghostTimeout = setTimeout(() => {
        ghost.style.display = 'none';
        if (timeLeft > 0) setTimeout(moveGhost, Math.random() * 500 + 200);
    }, Math.random() * 800 + 600); // Reste visible entre 0.6s et 1.4s
}

// Action au clic sur le fantôme
ghost.addEventListener('click', () => {
    score++;
    scoreDisplay.textContent = score;
    ghost.style.display = 'none'; 
    clearTimeout(ghostTimeout);
    
    // Petit effet visuel sur la bordure du conteneur
    gameContainer.style.borderColor = "#ff0000";
    setTimeout(() => gameContainer.style.borderColor = "#ff6600", 200);

    // Fait réapparaître un nouveau fantôme rapidement
    if (timeLeft > 0) setTimeout(moveGhost, Math.random() * 400 + 200);
});

// Action au clic sur le bouton "Démarrer"
startBtn.addEventListener('click', () => {
    // Réinitialisation des variables
    score = 0;
    timeLeft = 30;
    scoreDisplay.textContent = score;
    timeDisplay.textContent = timeLeft;
    
    startBtn.style.display = 'none';
    gameContainer.style.display = 'block';
    
    moveGhost();

    // Décompte du chronomètre
    gameInterval = setInterval(() => {
        timeLeft--;
        timeDisplay.textContent = timeLeft;
        
        if (timeLeft <= 0) {
            clearInterval(gameInterval);
            clearTimeout(ghostTimeout);
            ghost.style.display = 'none';
            startBtn.style.display = 'block';
            startBtn.textContent = 'Rejouer';
            alert('Temps écoulé ! Tu as attrapé ' + score + ' fantômes 👻');
        }
    }, 1000);
});
</script>
